[project]
name = "biomed-evidence-agent"
version = "0.1.0"
description = "Agentic RAG over PubMed and ClinicalTrials.gov with citation grounding, evals, and provenance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Angelo Kwak" }]
dependencies = [
    "anthropic>=0.70",
    "langgraph>=0.6",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "tenacity>=8.5",
    "truststore>=0.10",
]

[project.optional-dependencies]
tracing = ["langfuse>=3.0"]

[project.scripts]
biomed-agent = "biomed_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biomed_agent"]

# CPU-only PyTorch keeps the Docker image ~1.5 GB smaller (no CUDA wheels).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
